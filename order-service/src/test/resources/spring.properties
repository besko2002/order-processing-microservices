# Keep at most ONE Spring test ApplicationContext alive at a time.
#
# Every integration test in this module shares one static Postgres + one Kafka (see
# OrderIntegrationTest). Spring's default context cache holds up to 32 contexts, and a cached
# context is still a running application: its OutboxRelayScheduler keeps polling outbox_events
# every OUTBOX_POLL_MS (250 ms) with the real KafkaTemplate, and its saga timeout sweeper, refund
# recovery sweep and Kafka listeners keep working on the same tables.
#
# That breaks any test that needs the database to itself. OutboxRelayFailureTest disables the
# scheduler in ITS OWN context and drives the relay by hand, but a relay of another, still cached
# context publishes (or row-locks, via FOR UPDATE SKIP LOCKED) the very rows it is asserting on.
# It passes alone, and fails intermittently once a class with a default context ran before it.
#
# With a cap of 1, loading a context for a new configuration evicts - and closes - the previous
# one before the first test of the new class runs, so the context under test is the only live
# one. The price is that a configuration is rebuilt when classes with different configurations
# interleave (a few seconds each); the alternative, @DirtiesContext on every class that needs
# the database to itself, only covers the classes someone remembered to annotate.
spring.test.context.cache.maxSize=1
